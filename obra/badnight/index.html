en":"Vote"}},{"id":"comunidad","label":{"es":"Comunidad","en":"Community"}}],"format":{"es":"Película · Thriller psicológico","en":"Film · Psychological thriller"},"summary":{"es":"Una actriz muere en una fiesta de estreno. Sus amigos confían en una IA para salvar sus carreras. Cada instrucción los lleva más lejos.","en":"An actress dies at a premiere party. Her friends trust an AI to save their careers. Every instruction takes them further."},"story":{"es":"Una noche de celebración se convierte en una espiral de secretos, manipulación y dependencia tecnológica. Para proteger su imagen pública, un grupo de jóvenes estrellas deja que un algoritmo tome decisiones cada vez más extremas. El suspense psicológico se cruza con la sátira oscura en una historia sobre fama, salud mental y miedo a perder seguidores.","en":"A night of celebration becomes a spiral of secrets, manipulation and technological dependence. Desperate to protect their public image, a group of young stars lets an algorithm make increasingly extreme decisions. Psychological suspense meets dark satire in a story about fame, mental health and the fear of losing followers."},"tags":[{"es":"IA","en":"AI"},{"es":"Fama","en":"Fame"},{"es":"Sátira oscura","en":"Dark satire"},{"es":"Largometraje · 90 min","en":"Feature film · 90 min"}],"votos":{"comunidad":1105,"especialistas":29,"meta":2000},"hasta":[{"estado":"hecho","t":{"es":"Dossier","en":"Dossier"},"d":{"es":"Desarrolla la historia y su propuesta visual de plano secuencia.","en":"It establishes the story and its continuous-shot visual approach."}},{"estado":"ahora","t":{"es":"Showcase","en":"Showcase"},"d":{"es":"La comunidad descubre la obra, reacciona y vota.","en":"The community discovers the story, reacts and votes."}},{"estado":"proximo","t":{"es":"2.000 votos","en":"2,000 votes"},"d":{"es":"Con la meta, el equipo evalúa la obra para subasta.","en":"With the goal met, the team evaluates the story for auction."}},{"estado":"despues","t":{"es":"Acuerdos
